services:
  - type: web
    name: sankhya-opt
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci --prefix ui && npm run build
    startCommand: uvicorn api.gateway:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /openapi.json
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3